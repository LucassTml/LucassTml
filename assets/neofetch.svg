<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-labelledby="t">
<title id="t">Sleeping ASCII fox next to Lucas Eduardo's info: CS Eng. Student, AI/LLM, UPE - Poli, Recife, Brazil</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #24292f; }
  .bg { fill: #f6f8fa; }
  tspan, .fox { fill: #c4621d; }
  .fur { fill: #e8a26a; }
  .tip, .paw { fill: #8c959f; }
  .eye, .nose { fill: #24292f; font-weight: bold; }
  .key { fill: #c4621d; font-weight: bold; }
  .info tspan { fill: #24292f; }
  .info .key { fill: #c4621d; }
  .info .dim, .z { fill: #8c959f; }
  .cursor { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    text, .info tspan, .cursor { fill: #e6edf3; }
    .bg { fill: #161b22; }
    tspan, .key, .info .key { fill: #f0883e; }
    .fur { fill: #ffb77c; }
    .tip, .paw { fill: #f0f6fc; }
    .eye, .nose { fill: #e6edf3; }
    .info .dim, .z { fill: #8b949e; }
  }
  .z { opacity: 0; font-weight: bold; animation: float 3s ease-in-out infinite; }
  .z1 { animation-delay: 1s; }
  .z2 { animation-delay: 2s; }
  @keyframes float {
    0%   { opacity: 0; transform: translate(0, 6px); }
    25%  { opacity: 1; }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(10px, -14px); }
  }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .z, .cursor { animation: none; opacity: 1; } }
</style>
